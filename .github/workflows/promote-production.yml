name: Promote dev to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type promote to deploy the current dev image to production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  DEV_NAMESPACE: agent-relay
  PROD_NAMESPACE: agent-relay-production

jobs:
  promote:
    name: Promote current dev image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Confirm promotion
        if: ${{ inputs.confirm != 'promote' }}
        run: |
          echo "The confirmation input must be exactly 'promote'."
          exit 1

      - uses: actions/checkout@v7

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "KUBE_CONFIG_B64 is required in the production environment."
            exit 1
          fi
          kubeconfig="$RUNNER_TEMP/agent-relay-kubeconfig"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Read and validate the current dev image
        run: |
          kubectl -n "$DEV_NAMESPACE" rollout status deployment/relay --timeout=300s
          image=$(kubectl -n "$DEV_NAMESPACE" get deployment relay \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="relay")].image}')
          if [ -z "$image" ] || [[ "$image" == *'$(POSTGRES_PASSWORD)'* ]]; then
            echo "Could not determine a valid image from the dev deployment."
            exit 1
          fi
          echo "Promoting dev image: $image"
          echo "DEV_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Prepare production database credentials
        env:
          PRODUCTION_POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
        run: |
          # Reuse the password already attached to production when it exists;
          # PostgreSQL keeps using the password from first initialization.
          secret_name=$(kubectl -n "$PROD_NAMESPACE" get deployment relay \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="relay")].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name}' \
            2>/dev/null || true)
          if [ -z "$secret_name" ]; then
            secret_name=$(kubectl -n "$PROD_NAMESPACE" get statefulset postgres \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="postgres")].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name}' \
              2>/dev/null || true)
          fi

          if [ -n "$secret_name" ]; then
            password=$(kubectl -n "$PROD_NAMESPACE" get secret "$secret_name" \
              -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode)
            echo "Reusing the existing production database password."
          else
            if [ -z "${PRODUCTION_POSTGRES_PASSWORD:-}" ]; then
              echo "PRODUCTION_POSTGRES_PASSWORD is required for the first production deployment."
              exit 1
            fi
            password="$PRODUCTION_POSTGRES_PASSWORD"
            echo "Using the production environment database password for first initialization."
          fi

          echo "::add-mask::$password"
          mkdir -p .deploy
          (umask 077 && printf 'POSTGRES_PASSWORD=%s\n' "$password" > k8s-production/postgres.env)

      - name: Apply the promoted image to production
        run: |
          image_repo="${DEV_IMAGE%:*}"
          image_tag="${DEV_IMAGE##*:}"
          if [ "$image_repo" = "$DEV_IMAGE" ] || [ -z "$image_tag" ]; then
            echo "The dev image must use a tag, not only an image name: $DEV_IMAGE"
            exit 1
          fi

          cat > .deploy/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../k8s-production
          images:
            - name: agent-relay
              newName: $image_repo
              newTag: $image_tag
          EOF

          kubectl apply -k .deploy
          kubectl -n "$PROD_NAMESPACE" rollout status statefulset/postgres --timeout=300s
          kubectl -n "$PROD_NAMESPACE" rollout status deployment/relay --timeout=300s
          kubectl -n "$PROD_NAMESPACE" get pods -l app.kubernetes.io/name=relay \
            -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.spec.containers[0].image}{"\n"}{end}'

      - name: Smoke test production
        run: |
          kubectl -n "$PROD_NAMESPACE" port-forward svc/relay 18081:8000 > production-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT
          python3 scripts/smoke.py http://127.0.0.1:18081

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n "$PROD_NAMESPACE" get all,pvc || true
          kubectl -n "$PROD_NAMESPACE" describe pods || true
          kubectl -n "$PROD_NAMESPACE" logs deployment/relay --all-containers --tail=100 || true
          cat production-port-forward.log 2>/dev/null || true
